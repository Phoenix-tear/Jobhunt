name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -e ".[api,gmail,matching,dev]"

      - name: Install frontend dependencies and verify build
        run: |
          cd web
          npm ci
          npm run build
          npx tsc --noEmit
          npm test
          cd ..

      - name: Run Backend Pytest Suite
        run: |
          pytest -m "not live and not live_gemini and not gpu and not ollama"

      - name: Run Clean-Folder Acceptance Test
        env:
          CI: "true"
        run: |
          pytest tests/test_v13_acceptance.py -v

