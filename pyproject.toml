[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.1.0"
description = "Personal job-discovery pipeline: SQLite schema + ingestion layer"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Gmail OAuth (phase 4). Only `gmail-auth` and `ingest-email` need these.
# The local website (phase 5): `python -m jobhunt serve`.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.12",
]
gmail = [
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]
# Matching layer (step 3): resume text extraction and the in-memory similarity matrix.
matching = [
    "pypdf>=5.0",
    "numpy>=2.0",
    "pydantic>=2.5",
]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits real public endpoints; only runs with --live-smoke",
    "realdb: touches the real database; only runs with --real-db-smoke",
    "live_gemini: calls the real Gemini API; only runs with --live-gemini",
    "gpu: needs a local GPU",
    "ollama: needs a running local Ollama server",
]
